services:
  bot:
    build: .
    container_name: mcbot-panel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROFILES_FOLDER: /app/data/profiles
    volumes:
      - ./data:/app/data
    # Для device-code Microsoft auth удобно видеть логи
    stdin_open: true
    tty: true
